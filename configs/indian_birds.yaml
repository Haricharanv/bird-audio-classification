# ==============================================================================
# EfficientNet-B0 Configuration for 16 Indian & Common Bird Species
# ==============================================================================
_base_: "configs/effnet_b0.yaml"

experiment_name: "effnet_b0_indian16"
debug: false

system:
  device: "auto"
  num_workers: 0
  pin_memory: false
  mixed_precision: "no"

data:
  raw_dir: "../data/indian_birds"
  cache_dir: "data/cache_indian"
  metadata_dir: "data/metadata_indian"
  noise_bank_path: "data/noise/noise_bank_indian.npy"
  min_files_per_species: 10
  max_chunks_per_species: 120
  noise_bank_size: 120
  split_by: "filename"

audio:
  fmin: 150.0

augment:
  waveform:
    pitch_shift_prob: 0.0
    time_stretch_prob: 0.0

model:
  name: "timm_cnn"
  backbone: "efficientnet_b0"
  in_chans: 1
  pretrained: true
  dropout: 0.3
  freeze_epochs: 1

train:
  epochs: 12
  batch_size: 16
  head_lr: 0.001
  backbone_lr: 0.0003
  scheduler: "one_cycle"
  warmup_epochs: 2
  early_stopping_patience: 5
